apiVersion: v1
kind: ConfigMap
metadata:
  name: guardlab-metric-alerts
  namespace: guardlab
data:
  rules.yaml: |
    groups:
      - name: guardlab-service
        interval: 30s
        rules:
          - alert: GuardLabSafeIdorUnexpectedAccess # если idor сценарий на безопасную реализацию вернет секрет - неправильное поведение
            expr: sum(increase(guardlab_lab_key_access_total{source="synthetic",implementation="safe",result="allowed"}[5m])) > 0
            for: 30s
            labels:
              severity: critical # в будущем можно будет настроить кому отправлять, critical потому что это основной сценарий
            annotations:
              summary: Safe IDOR implementation allowed access
              description: The protected IDOR implementation returned an unexpected allowed result.
          - alert: GuardLabAdminLoginFailures # много неудачных попыток входа
            expr: sum(increase(guardlab_auth_login_attempts_total{result="failure"}[5m])) > 5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: failed administrator logins
              description: More than five administrator login attempts failed in the last five minutes.
      - name: guardlab-http-runtime
        interval: 30s
        rules:
          - alert: GuardLabApiHigh5xxRate
            expr: (sum(rate(http_requests_received_total{app="guardlab-api",code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_received_total{app="guardlab-api"}[5m])), 0.01)) > 0.05 and sum(increase(http_requests_received_total{app="guardlab-api"}[5m])) > 20
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: GuardLab API 5xx high  rate 
              description: More than 5% failed with 5xx responses
          - alert: GuardLabUnauthorizedResponses
            expr: sum(rate(http_requests_received_total{app="guardlab-api",code=~"401|403"}[5m])) * 60 > 3
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Elevated 401/403 responses
              description: "API returned {{ $value | printf \"%.1f\" }} unauthorized or forbidden responses per minute over five minutes."
          - alert: GuardLabDotNetThreadPoolQueue
            expr: (sum(increase(dotnet_threadpool_queue_length_count{app="guardlab-api"}[1m])) - sum(increase(dotnet_threadpool_queue_length_bucket{app="guardlab-api",le="0"}[1m]))) > 0
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: .NET ThreadPool queue detected
              description: Min 1 ThreadPool queue observation above zero
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert-metrics
  namespace: guardlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert-metrics
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.151.0
          args:
            - -rule=/etc/vmalert/rules.yaml
            - -datasource.url=http://vmsingle-vm-single-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428
            - -notifier.url=http://alertmanager.guardlab.svc.cluster.local:9093
            - -httpListenAddr=:8880
          ports:
            - name: http
              containerPort: 8880
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: rules
          configMap:
            name: guardlab-metric-alerts
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert-metrics
  namespace: guardlab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vmalert-metrics
  ports:
    - name: http
      port: 8880
      targetPort: http
