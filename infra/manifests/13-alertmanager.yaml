apiVersion: v1
kind: ConfigMap
metadata:
  name: guardlab-alertmanager-config
  namespace: guardlab
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: guardlab
      #алерты с одинаковым alertname объединяются в одну группу
      group_by: [alertname]
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 1h
    receivers:
      #alertmanager примет алерт и покажет его в UI, но никуда не отправит - можно доп настроить отправку на почту и тд
      - name: guardlab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: guardlab
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: guardlab-alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: guardlab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http