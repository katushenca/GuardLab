apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: guardlab-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: guardlab-gateway
  namespace: guardlab
spec:
  gatewayClassName: guardlab-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same