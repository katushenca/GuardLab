#содержит правила, которые vmalert будет периодически проверять
apiVersion: v1
kind: ConfigMap
metadata:
  name: guardlab-vmalert-config
  namespace: guardlab
data:
  #vmalert прочитает этот файл из /etc/vmalert/rules.yaml
  rules.yaml: |
    groups:
      - name: guardlab-api
        type: vlogs
        interval: 1m
        rules:
          - alert: GuardLabApiWarningLogs
            # Ищем Warning логи за последние 5 минут
            expr: '{container.image.name="guardlab-api"} _time:5m LogLevel:="Warning" | stats count() as warning_logs | filter warning_logs:>0'
            for: 1m
            labels:
              severity: warning # потом в зависимости от этого можно настроить при каких уровнях куда отправлять уведомления
            annotations:
              # Описание, отображаемое вместе с алертом.
              description: 1 or >  4xx was seen in the last five minutes.
---
# Deployment запускает vmalert
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: guardlab
  labels:
    app.kubernetes.io/name: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.151.0
          args:
            - -rule=/etc/vmalert/rules.yaml
            - -rule.defaultRuleType=vlogs
            #откуда брать данные для выполнения запроса
            - -datasource.url=http://victoria-logs.guardlab.svc.cluster.local:9428
            #кудапередавать алерт
            - -notifier.url=http://alertmanager.guardlab.svc.cluster.local:9093
            - -httpListenAddr=:8880
          ports:
            - name: http
              containerPort: 8880
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: rules
          configMap:
            name: guardlab-vmalert-config
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: guardlab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http