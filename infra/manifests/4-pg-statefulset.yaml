apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: guardlab
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: guardlab
            - name: POSTGRES_USER
              value: guardlab_bootstrap
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guardlab-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guardlab-secrets
                  key: DB_OWNER_PASSWORD
            - name: PLATFORM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guardlab-secrets
                  key: PLATFORM_DB_PASSWORD
            - name: SANDBOX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guardlab-secrets
                  key: SANDBOX_DB_PASSWORD
          readinessProbe: # пока не пройдет - servuce не будет на него трафик отправлять
            exec:
              command: ["sh", "-c", "pg_isready -U guardlab_bootstrap -d guardlab"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe: # перезапуск при падении
            exec:
              command: ["sh", "-c", "pg_isready -U guardlab_bootstrap -d guardlab"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts: # подключаем тома
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/01-init-roles.sql # файл с командами для инициализации БД
              subPath: 01-init-roles.sql
              readOnly: true
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
  volumeClaimTemplates: # statefulset создаст клейм для пода
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"] # один узел может использовать том (а нам больше и не надо)
        resources:
          requests:
            storage: 1Gi
