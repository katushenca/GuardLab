apiVersion: v1
kind: ConfigMap
metadata:
  name: guardlab-blackbox-exporter
  namespace: monitoring
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: ip4
      tcp_connect:
        prober: tcp
        timeout: 5s
      http_idor_scenario:
        prober: http
        timeout: 10s
        http:
          method: POST
          headers:
            Content-Type: application/json
            X-GuardLab-Probe: synthetic
          body: '{"sid":"sid_alice_demo","keyId":"30000000-0000-4000-8000-000000000002"}'
          valid_status_codes: [200]
          fail_if_body_not_matches_regexp:
            - '"vulnerableStatusCode":\s*200'
            - '"safeStatusCode":\s*403'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardlab-blackbox-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardlab-blackbox-exporter
  template:
    metadata:
      labels:
        app: guardlab-blackbox-exporter
    spec:
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.29.1
          args:
            - --config.file=/etc/blackbox_exporter/config.yml
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9115
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9115
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox_exporter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: guardlab-blackbox-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: guardlab-blackbox-exporter
  namespace: monitoring
spec:
  selector:
    app: guardlab-blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: 9115