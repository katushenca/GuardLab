apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guardlab-api
  namespace: guardlab
spec:
  parentRefs:
    - name: guardlab-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 8080
          weight: 0
        - name: api-canary
          port: 8080
          weight: 100