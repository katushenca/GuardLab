apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardlab-api-canary
  namespace: guardlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guardlab-api-canary
  template:
    metadata:
      labels:
        app: guardlab-api-canary
        version: "2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: guardlab-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: PLATFORM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guardlab-secrets
                  key: PLATFORM_DB_PASSWORD
            - name: SANDBOX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guardlab-secrets
                  key: SANDBOX_DB_PASSWORD
            - name: ConnectionStrings__Platform
              value: Host=postgres;Port=5432;Database=guardlab;Username=platform_app;Password=$(PLATFORM_DB_PASSWORD)
            - name: ConnectionStrings__Sandbox
              value: Host=postgres;Port=5432;Database=guardlab;Username=lab_app;Password=$(SANDBOX_DB_PASSWORD)
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: guardlab-secrets
                  key: JWT_SIGNING_KEY
            - name: Jwt__Issuer
              valueFrom:
                secretKeyRef:
                  name: guardlab-secrets
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                secretKeyRef:
                  name: guardlab-secrets
                  key: JWT_AUDIENCE
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: guardlab
spec:
  type: ClusterIP
  selector:
    app: guardlab-api-canary
  ports:
    - name: http
      port: 8080
      targetPort: 8080