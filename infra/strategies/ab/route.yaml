apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guardlab-api
  namespace: guardlab
spec:
  parentRefs:
    - name: guardlab-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
          headers:
            - name: X-GuardLab-Audience
              type: Exact
              value: employee
      backendRefs:
        - name: api-canary
          port: 8080
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /api
          headers:
            - name: X-GuardLab-Audience
              type: Exact
              value: non-employee
      backendRefs:
        - name: api
          port: 8080
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 8080
          weight: 100