apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guardlab-api
  namespace: guardlab
spec:
  parentRefs:
    - name: guardlab-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-green
          port: 8080