grafana:
  enabled: true

vmsingle:
  enabled: true
  spec:
    retentionPeriod: "35d"
    replicaCount: 1

vmagent:
  enabled: true
  # Чтобы vmagent из namespace monitoring мог обнаруживать поды из другого ns
  rbac:
    namespaced: false
  spec:
    scrapeInterval: 15s
    # автоматически не собираем, через аннотации 
    selectAllByDefault: false
    # собираем по аннотациям с помощью sd
    # цели - поды
    # дальше смотрим поды с аннотациями и собираем путь по которым метрики будем собирать
    inlineScrapeConfig: |
      - job_name: guardlab-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - guardlab
        relabel_configs:
          - action: keep
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            regex: "true"
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            target_label: __metrics_path__
            regex: (.+)
          - action: replace
            source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
      - job_name: guardlab-probe-api
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://api.guardlab.svc.cluster.local:8080/metrics
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: guardlab-blackbox-exporter.monitoring.svc.cluster.local:9115
          - target_label: probe
            replacement: api_metrics
      - job_name: guardlab-probe-postgres
        metrics_path: /probe
        params:
          module: [tcp_connect]
        static_configs:
          - targets:
              - postgres.guardlab.svc.cluster.local:5432
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: guardlab-blackbox-exporter.monitoring.svc.cluster.local:9115
          - target_label: probe
            replacement: postgres_tcp
      - job_name: guardlab-probe-idor-scenario
        metrics_path: /probe
        params:
          module: [http_idor_scenario]
        static_configs:
          - targets:
              - http://api.guardlab.svc.cluster.local:8080/api/labs/idor-key-access/run
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: guardlab-blackbox-exporter.monitoring.svc.cluster.local:9115
          - target_label: probe
            replacement: idor_scenario
#пока не надо, откючила
vmalert:
  enabled: false

alertmanager:
  enabled: false

defaultRules:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
